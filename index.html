<style>

ge'] 3", "[] 0"], "Sort by Vowel Count": ["['banana', 'kiwi', 'pear', 'apple', 'sky']", "['aa', 'a']"], "Hollow Right Triangle": ["*\n**\n* *\n*  *\n*****", "*\n**"], "Centred Pascal's Triangle": ["         1          \n        1 1         \n       1 2 1        \n      1 3 3 1       \n     1 4 6 4 1      ", "     1      \n    1 1     \n   1 2 1    "], "Sort Students by Marks (lambda)": ["Bob 95\nAmy 80\nCy 70"]});const ALGO={"Even or Odd": "1 Start\n2 Read a whole number typed by the user into n.\n3 If (the remainder when n is divided by 2) equals 0:\n  3.1 Display the text 'Even'.\n4 Otherwise:\n  4.1 Display the text 'Odd'.\n5 End", "FizzBuzz": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 If (the remainder when i is divided by 15) equals 0:\n    3.1.1 Display the text 'FizzBuzz'.\n  3.2 Otherwise, if (the remainder when i is divided by 3) equals 0:\n    3.2.1 Display the text 'Fizz'.\n  3.3 Otherwise, if (the remainder when i is divided by 5) equals 0:\n    3.3.1 Display the text 'Buzz'.\n  3.4 Otherwise:\n    3.4.1 Display i.\n4 End", "Collatz Steps": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set steps to 0.\n4 While n is not equal to 1, repeat the following:\n  4.1 If (the remainder when n is divided by 2) equals 0:\n    4.1.1 Set n to the whole-number part of n divided by 2.\n  4.2 Otherwise:\n    4.2.1 Set n to (3 times n) plus 1.\n  4.3 Increase steps by 1.\n5 Display steps.\n6 End", "Largest of Three": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in a, b, c in order.\n3 If a is at least b as well as a is at least c:\n  3.1 Display a.\n4 Otherwise, if b is at least c:\n  4.1 Display b.\n5 Otherwise:\n  5.1 Display c.\n6 End", "Leap Year": "1 Start\n2 Read a whole number typed by the user into y.\n3 If ((the remainder when y is divided by 4) equals 0 as well as (the remainder when y is divided by 100) is not equal to 0) or (the remainder when y is divided by 400) equals 0:\n  3.1 Display the text 'Leap year'.\n4 Otherwise:\n  4.1 Display the text 'Not a leap year'.\n5 End", "Sum of 1 to n": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set total to 0.\n4 For each i taking the whole numbers from 1 up to n (included):\n  4.1 Increase total by i.\n5 Display total.\n6 End", "Prime Check": "1 Start\n2 Read a whole number typed by the user into n.\n3 If n is less than 2:\n  3.1 Display the text 'Not prime'.\n4 Otherwise:\n  4.1 Set i to 2.\n  4.2 Set prime to true.\n  4.3 While (i times i) is at most n, repeat the following:\n    4.3.1 If (the remainder when n is divided by i) equals 0:\n      4.3.1.1 Set prime to false.\n      4.3.1.2 Leave the loop.\n    4.3.2 Increase i by 1.\n  4.4 If prime:\n    4.4.1 Display the text 'Prime'.\n  4.5 Otherwise:\n    4.5.1 Display the text 'Not prime'.\n5 End", "Digit Sum": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set s to 0.\n4 While n is greater than 0, repeat the following:\n  4.1 Increase s by the remainder when n is divided by 10.\n  4.2 Divide n by 10, keeping the whole-number part.\n5 Display s.\n6 End", "Primes up to n (Sieve)": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set is_p to a list holding true times (n plus 1).\n4 For each i taking the whole numbers from 2 up to n (included):\n  4.1 If item i of is_p:\n    4.1.1 For each j taking the whole numbers from i times i towards n plus 1 (excluded) in steps of i:\n      4.1.1.1 Set item j of is_p to false.\n5 Display the list of i for each i in the whole numbers from 2 up to n (included), only when item i of is_p.\n6 End", "Number Pyramid": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display (a space repeated (n minus i) times) followed by (the text '*' repeated ((2 times i) minus 1) times).\n4 End", "Perfect Numbers up to n": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each x taking the whole numbers from 2 up to n (included):\n  3.1 Set s to 0.\n  3.2 For each d taking the whole numbers from 1 up to x - 1:\n    3.2.1 If (the remainder when x is divided by d) equals 0:\n      3.2.1.1 Increase s by d.\n  3.3 If s equals x:\n    3.3.1 Display x.\n4 End", "Armstrong Numbers in a Range": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in lo, hi in order.\n3 For each x taking the whole numbers from lo up to hi (included):\n  3.1 Set k to the number of items in (x written as text).\n  3.2 If (the total of (the values of ((c as a whole number) raised to the power k) for each c in x written as text)) equals x:\n    3.2.1 Display x.\n4 End", "Prime Factorization": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set f to 2.\n4 Set out to an empty list.\n5 While n is greater than 1, repeat the following:\n  5.1 While (the remainder when n is divided by f) equals 0, repeat the following:\n    5.1.1 Add f to the end of the list out.\n    5.1.2 Divide n by f, keeping the whole-number part.\n  5.2 Increase f by 1.\n6 Display the items of (every item of out converted to text) joined with the text ' x ' placed between them.\n7 End", "Number to Words (0-999)": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set ones to a list holding the text 'zero', the text 'one', the text 'two', the text 'three', the text 'four', the text 'five', the text 'six', the text 'seven', the text 'eight', the text 'nine', the text 'ten', the text 'eleven', the text 'twelve', the text 'thirteen', the text 'fourteen', the text 'fifteen', the text 'sixteen', the text 'seventeen', the text 'eighteen', the text 'nineteen'.\n4 Set tens to a list holding an empty text, an empty text, the text 'twenty', the text 'thirty', the text 'forty', the text 'fifty', the text 'sixty', the text 'seventy', the text 'eighty', the text 'ninety'.\n5 Set words to an empty list.\n6 If n is at least 100:\n  6.1 Add (item (the whole-number part of n divided by 100) of ones) followed by the text ' hundred' to the end of the list words.\n  6.2 Replace n with the remainder when it is divided by 100.\n7 If n is at least 20:\n  7.1 Set w to item (the whole-number part of n divided by 10) of tens.\n  7.2 If the remainder when n is divided by 10:\n    7.2.1 Increase w by the text '-' followed by (item (the remainder when n is divided by 10) of ones).\n  7.3 Add w to the end of the list words.\n8 Otherwise, if n is greater than 0 or not (words):\n  8.1 Add item n of ones to the end of the list words.\n9 Display the items of words joined with a space placed between them.\n10 End", "Count and Reverse Digits": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set rev to 0.\n4 Set count to 0.\n5 While n is greater than 0, repeat the following:\n  5.1 Set rev to (rev times 10) plus (the remainder when n is divided by 10).\n  5.2 Divide n by 10, keeping the whole-number part.\n  5.3 Increase count by 1.\n6 Display count, rev, with a space between the values.\n7 End", "Month Calendar": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in days, start in order.\n3 Display the text 'Su Mo Tu We Th Fr Sa'.\n4 Set line to the text '   ' repeated start times.\n5 For each d taking the whole numbers from 1 up to days (included):\n  5.1 Increase line by ((d written as text) padded on the left to a width of 2) followed by a space.\n  5.2 If (the remainder when (start plus d) is divided by 7) equals 0:\n    5.2.1 Display rstrip applied to line.\n    5.2.2 Set line to an empty text.\n6 If line:\n  6.1 Display rstrip applied to line.\n7 End", "Reverse a String": "1 Start\n2 Read one line of text typed by the user into s.\n3 Display s in reverse order.\n4 End", "Palindrome Check": "1 Start\n2 Set s to the items of (the values of (c in lower case) for each c in the next line typed by the user, only when c is a letter or a digit) joined with an empty text into s.\n3 Set out to an empty text.\n4 Set i to 0.\n5 While i is less than (the number of items in s), repeat the following:\n  5.1 Set j to i.\n  5.2 While j is less than (the number of items in s) as well as item j of s equals item i of s, repeat the following:\n    5.2.1 Increase j by 1.\n  5.3 Increase out by (item i of s) followed by ((j minus i) written as text).\n  5.4 Set i to j.\n6 Display out.\n7 End", "First Non-Repeating Char": "1 Start\n2 Read one line of text typed by the user into s.\n3 For each c in s:\n  3.1 If (the number of times c occurs in s) equals 1:\n    3.1.1 Display c.\n    3.1.2 Leave the loop.\n4 If the loop ended without being cut short:\n  4.1 Display the text 'None'.\n5 End", "Longest Common Prefix": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Set p to the first item of w.\n4 For each x in the items of w from position 1 onward:\n  4.1 While not (x begins with p), repeat the following:\n    4.1.1 Set p to all items of p except the last.\n5 If p:\n  5.1 Display p.\n6 Otherwise:\n  6.1 Display the text 'None'.\n7 End", "Valid Brackets": "1 Start\n2 Read one line of text typed by the user into s.\n3 Set st to an empty list.\n4 Set pair to a dictionary pairing the text ')' with the text '(', the text ']' with the text '[', the text '}' with the text '{'.\n5 Set ok to true.\n6 For each c in s:\n  6.1 If c is found in the text '([{':\n    6.1.1 Add c to the end of the list st.\n  6.2 Otherwise, if c is found in pair:\n    6.2.1 If not (st) or (the last item removed from st) is not equal to item c of pair:\n      6.2.1.1 Set ok to false.\n      6.2.1.2 Leave the loop.\n7 If ok as well as not (st):\n  7.1 Display the text 'Valid'.\n8 Otherwise:\n  8.1 Display the text 'Invalid'.\n9 End", "Longest Palindromic Substring": "1 Start\n2 Read one line of text typed by the user into s.\n3 Set best to an empty text.\n4 For each i taking the whole numbers from 0 up to one less than (the number of items in s):\n  4.1 For each a, b in a group holding a group holding i, i, a group holding i, (i plus 1):\n    4.1.1 While a is at least 0 as well as b is less than (the number of items in s) as well as item a of s equals item b of s, repeat the following:\n      4.1.1.1 Decrease a by 1.\n      4.1.1.2 Increase b by 1.\n    4.1.2 If ((b minus a) minus 1) is greater than (the number of items in best):\n      4.1.2.1 Set best to the items of s from position a plus 1 up to position b (excluded).\n5 Display best.\n6 End", "Longest Substring Without Repeats": "1 Start\n2 Read one line of text typed by the user into s.\n3 Set last to an empty dictionary.\n4 Set start to 0.\n5 Set best to 0.\n6 For each i, c in s with positions numbered from 0:\n  6.1 If c is found in last:\n    6.1.1 If item c of last is at least start:\n      6.1.1.1 Set start to (item c of last) plus 1.\n  6.2 Set item c of last to i.\n  6.3 Set best to the largest of best, ((i minus start) plus 1).\n7 Display best.\n8 End", "Title Case Converter": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Display the items of (the values of ((the first item of x in upper case) followed by (the items of x from position 1 onward in lower case)) for each x in w) joined with a space placed between them.\n4 End", "Word Wrap": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Read a whole number typed by the user into width.\n4 Set line to an empty text.\n5 For each x in w:\n  5.1 If line as well as (((the number of items in line) plus 1) plus (the number of items in x)) is greater than width:\n    5.1.1 Display line.\n    5.1.2 Set line to x.\n  5.2 Otherwise, if line:\n    5.2.1 Increase line by a space followed by x.\n  5.3 Otherwise:\n    5.3.1 Set line to x.\n6 If line:\n  6.1 Display line.\n7 End", "Largest Element": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set m to the first item of a.\n4 For each x in a:\n  4.1 If x is greater than m:\n    4.1.1 Set m to x.\n5 Display m.\n6 End", "Remove Duplicates": "1 Start\n2 Read one line of text, then break it into words stored in a.\n3 Set at the same time: seen to an empty set, out to an empty list.\n4 For each x in a:\n  4.1 If x is not found in seen:\n    4.1.1 Put x into the set seen.\n    4.1.2 Add x to the end of the list out.\n5 Display out.\n6 End", "Two Sum": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Read a whole number typed by the user into t.\n4 Set d to an empty dictionary.\n5 For each i, x in a with positions numbered from 0:\n  5.1 If (t minus x) is found in d:\n    5.1.1 Display item (t minus x) of d, i, with a space between the values.\n    5.1.2 Leave the loop.\n  5.2 Set item x of d to i.\n6 If the loop ended without being cut short:\n  6.1 Display the text 'None'.\n7 End", "Sum and Average": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Display the total of a, (the total of a) divided by (the number of items in a), with a space between the values.\n4 End", "Reverse a List": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Display a in reverse order.\n4 End", "Count Even Numbers": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Display the number of items in (the list of x for each x in a, only when (the remainder when x is divided by 2) equals 0).\n4 End", "Second Largest": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set s to (the distinct items of a) in ascending order.\n4 If (the number of items in s) is greater than 1:\n  4.1 Display item (negative 2) of s.\n5 Otherwise:\n  5.1 Display the text 'None'.\n6 End", "Rotate Left by k": "1 Start\n2 Read one line of text, then break it into words stored in a.\n3 Set k to the remainder when (the whole number typed by the user) is divided by (the number of items in a).\n4 Display (the items of a from position k onward) plus (the first k items of a).\n5 End", "Bubble Sort": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set n to the number of items in a.\n4 For each i taking the whole numbers from 0 up to n - 1:\n  4.1 For each j taking the whole numbers from 0 up to one less than ((n minus i) minus 1):\n    4.1.1 If item j of a is greater than item (j plus 1) of a:\n      4.1.1.1 Swap the values of item j of a with item (j plus 1) of a.\n5 Display a.\n6 End", "Merge Sorted Lists": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Read one line of whole numbers separated by spaces into the list b.\n4 Set every one of i, j to 0.\n5 Set r to an empty list.\n6 While i is less than (the number of items in a) as well as j is less than (the number of items in b), repeat the following:\n  6.1 If item i of a is at most item j of b:\n    6.1.1 Add item i of a to the end of the list r.\n    6.1.2 Increase i by 1.\n  6.2 Otherwise:\n    6.2.1 Add item j of b to the end of the list r.\n    6.2.2 Increase j by 1.\n7 Display (r plus (the items of a from position i onward)) plus (the items of b from position j onward).\n8 End", "Find the Missing Number": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set n to (the number of items in a) plus 1.\n4 Display (the whole-number part of (n times (n plus 1)) divided by 2) minus (the total of a).\n5 End", "Move Zeros to End": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set r to the list of x for each x in a, only when x is not equal to 0.\n4 Display r plus (a list holding 0 times ((the number of items in a) minus (the number of items in r))).\n5 End", "Maximum Subarray Sum": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set every one of cur, best to the first item of a.\n4 For each x in the items of a from position 1 onward:\n  4.1 Set cur to the largest of x, (cur plus x).\n  4.2 Set best to the largest of best, cur.\n5 Display best.\n6 End", "Longest Increasing Subsequence": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set dp to a list holding 1 times (the number of items in a).\n4 For each i taking the whole numbers from 0 up to one less than (the number of items in a):\n  4.1 For each j taking the whole numbers from 0 up to i - 1:\n    4.1.1 If item j of a is less than item i of a:\n      4.1.1.1 Set item i of dp to the largest of item i of dp, ((item j of dp) plus 1).\n5 Display the largest item of dp.\n6 End", "Count Pairs with Sum": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Read a whole number typed by the user into t.\n4 Set c to 0.\n5 For each i taking the whole numbers from 0 up to one less than (the number of items in a):\n  5.1 For each j taking the whole numbers from i plus 1 up to one less than (the number of items in a):\n    5.1.1 If ((item i of a) plus (item j of a)) equals t:\n      5.1.1.1 Increase c by 1.\n6 Display c.\n7 End", "Rotate Matrix Clockwise": "1 Start\n2 Read a whole number typed by the user into r.\n3 Read r lines of whole numbers (one list per line) into the list m.\n4 Set rot to the list of (row as a list) for each row in the items of the items of m in reverse order.\n5 For each row in rot:\n  5.1 Display the items of (every item of row converted to text) joined with a space placed between them.\n6 End", "Tuple Sum and Max": "1 Start\n2 Read one line of whole numbers separated by spaces into the group t.\n3 Display the total of t, the largest item of t, with a space between the values.\n4 End", "Swap Two Values": "1 Start\n2 Read one line of text, then break it into words stored in a, b.\n3 Swap the values of a with b.\n4 Display a, b, with a space between the values.\n5 End", "Count in Tuple": "1 Start\n2 Set t to ((the next line typed by the user) broken into words) as a group.\n3 Read one line of text typed by the user into x.\n4 Display the number of times x occurs in t.\n5 End", "Reverse a Tuple": "1 Start\n2 Set t to ((the next line typed by the user) broken into words) as a group.\n3 Display t in reverse order.\n4 End", "Index of Min and Max": "1 Start\n2 Read one line of whole numbers separated by spaces into the group t.\n3 Display the position of (the smallest item of t) in t, the position of (the largest item of t) in t, with a space between the values.\n4 End", "Tuple of Squares": "1 Start\n2 Read one line of whole numbers separated by spaces into the group t.\n3 Display (the values of (x times x) for each x in t) as a group.\n4 End", "Sort Students by Marks": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set s to an empty list.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, m.\n  4.2 Add a group holding name, (m as a whole number) to the end of the list s.\n5 Sort the list s in descending order by a rule that takes t giving item 1 of t.\n6 For each name, m in s:\n  6.1 Display name, m, with a space between the values.\n7 End", "Unique Pairs with Sum": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Read a whole number typed by the user into t.\n4 Set res to an empty set.\n5 For each i taking the whole numbers from 0 up to one less than (the number of items in a):\n  5.1 For each j taking the whole numbers from i plus 1 up to one less than (the number of items in a):\n    5.1.1 If ((item i of a) plus (item j of a)) equals t:\n      5.1.1.1 Put a group holding (the smallest of item i of a, item j of a), (the largest of item i of a, item j of a) into the set res.\n6 Display res in ascending order.\n7 End", "Matrix Transpose": "1 Start\n2 Read a whole number typed by the user into r.\n3 Set m to (the values of ((every item of ((the next line typed by the user) broken into words) converted to a whole number) as a group) for each _ in the whole numbers from 0 up to r - 1) as a group.\n4 Display (the items of the items of m) as a group.\n5 End", "Pythagorean Triples": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each a taking the whole numbers from 1 up to n - 1:\n  3.1 For each b taking the whole numbers from a up to n - 1:\n    3.1.1 Set c to ((a times a) plus (b times b)) raised to the power 0.5.\n    3.1.2 If c equals (c as a whole number):\n      3.1.2.1 If c is at most n:\n        3.1.2.1.1 Display a group holding a, b, (c as a whole number).\n4 End", "Closest Point to Origin": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set pts to an empty list.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of whole numbers separated by spaces, then store them in x, y in order.\n  4.2 Add a group holding x, y to the end of the list pts.\n5 Set best to the item of pts with the smallest value under a rule that takes p giving ((the first item of p) raised to the power 2) plus ((item 1 of p) raised to the power 2).\n6 Display best.\n7 End", "Sort by Two Keys": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set r to an empty list.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, age.\n  4.2 Add a group holding name, (age as a whole number) to the end of the list r.\n5 Sort the list r in ascending order by a rule that takes t giving a group holding item 1 of t, the first item of t.\n6 For each t in r:\n  6.1 Display the first item of t, item 1 of t, with a space between the values.\n7 End", "Merge Overlapping Intervals": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set iv to an empty list.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n  4.2 Add a group holding a, b to the end of the list iv.\n5 Sort the list iv in ascending order.\n6 Set res to a list holding the first item of iv.\n7 For each a, b in the items of iv from position 1 onward:\n  7.1 If a is at most item 1 of the last item of res:\n    7.1.1 Set the last item of res to a group holding the first item of the last item of res, (the largest of item 1 of the last item of res, b).\n  7.2 Otherwise:\n    7.2.1 Add a group holding a, b to the end of the list res.\n8 Display res.\n9 End", "Nearest Pair of Points": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines of whole numbers (one group per line) into the list pts.\n4 Set best to nothing.\n5 For each i taking the whole numbers from 0 up to n - 1:\n  5.1 For each j taking the whole numbers from i plus 1 up to n - 1:\n    5.1.1 Set d to (((the first item of item i of pts) minus (the first item of item j of pts)) raised to the power 2) plus (((item 1 of item i of pts) minus (item 1 of item j of pts)) raised to the power 2).\n    5.1.2 If best is nothing or d is less than the first item of best:\n      5.1.2.1 Set best to a group holding d, item i of pts, item j of pts.\n6 Display item 1 of best, item 2 of best, ((the first item of best) raised to the power 0.5) rounded to 2 decimal places, with a space between the values.\n7 End", "Average of Two Marks": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set rec to an empty list.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, a, b.\n  4.2 Add a group holding name, (a as a whole number), (b as a whole number) to the end of the list rec.\n5 For each name, a, b in rec:\n  5.1 Display name, (a plus b) divided by 2, with a space between the values.\n6 End", "Rectangle Overlap Area": "1 Start\n2 Read one line of whole numbers separated by spaces into the group a.\n3 Read one line of whole numbers separated by spaces into the group b.\n4 Set w to (the smallest of item 2 of a, item 2 of b) minus (the largest of the first item of a, the first item of b).\n5 Set h to (the smallest of item 3 of a, item 3 of b) minus (the largest of item 1 of a, item 1 of b).\n6 If w is greater than 0 as well as h is greater than 0:\n  6.1 Display w times h.\n7 Otherwise:\n  7.1 Display 0.\n8 End", "Word Lengths": "1 Start\n2 Set d to an empty dictionary.\n3 For each w in (the next line typed by the user) broken into words:\n  3.1 Set item w of d to the number of items in w.\n4 For each w in d:\n  4.1 Display w, item w of d, with a space between the values.\n5 End", "Lookup with Default": "1 Start\n2 Set d to a dictionary pairing the text 'a' with 1, the text 'b' with 2.\n3 Read one line of text typed by the user into k.\n4 Display the value stored under k in d (or the text 'Not found' if it is missing).\n5 End", "Sum of Values": "1 Start\n2 Set d to a dictionary pairing the text 'x' with 10, the text 'y' with 20, the text 'z' with 5.\n3 Display the total of (the values of d).\n4 Display the number of items in d.\n5 End", "Squares Dictionary": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set d to a dictionary pairing i with i times i for each i in the whole numbers from 1 up to n (included).\n4 For each k in d:\n  4.1 Display k, item k of d, with a space between the values.\n5 End", "Character Frequency": "1 Start\n2 Set d to an empty dictionary.\n3 For each c in the next line typed by the user:\n  3.1 Set item c of d to (the value stored under c in d (or 0 if it is missing)) plus 1.\n4 For each k in d in ascending order:\n  4.1 Display k, item k of d, with a space between the values.\n5 End", "Invert a Dictionary": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set d to an empty dictionary.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in k, v.\n  4.2 Set item k of d to v.\n5 Set inv to an empty dictionary.\n6 For each k in d:\n  6.1 Set item (item k of d) of inv to k.\n7 For each k in inv in ascending order:\n  7.1 Display k, item k of inv, with a space between the values.\n8 End", "Group by First Letter": "1 Start\n2 Set g to an empty dictionary.\n3 For each w in (the next line typed by the user) broken into words:\n  3.1 Add w to the end of the list setdefault applied to g with the first item of w, an empty list.\n4 For each k in g in ascending order:\n  4.1 Display k, item k of g, with a space between the values.\n5 End", "Anagram Groups": "1 Start\n2 Set g to an empty dictionary.\n3 For each w in (the next line typed by the user) broken into words:\n  3.1 Add w to the end of the list setdefault applied to g with (the items of (w in ascending order) joined with an empty text placed between them), an empty list.\n4 For each k in g in ascending order:\n  4.1 Display item k of g.\n5 End", "Top-k Frequent Words": "1 Start\n2 Set d to an empty dictionary.\n3 For each w in (the next line typed by the user) broken into words:\n  3.1 Set item w of d to (the value stored under w in d (or 0 if it is missing)) plus 1.\n4 Read a whole number typed by the user into k.\n5 Set items to (the key-value pairs of d) in ascending order by a rule that takes p giving a group holding (negative item 1 of p), the first item of p.\n6 For each w, c in the first k items of items:\n  6.1 Display w, c, with a space between the values.\n7 End", "Inventory Simulator": "1 Start\n2 Set inv to an empty dictionary.\n3 Read a whole number typed by the user into n.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in p.\n  4.2 If the first item of p equals the text 'add':\n    4.2.1 Set item (item 1 of p) of inv to (the value stored under item 1 of p in inv (or 0 if it is missing)) plus (item 2 of p as a whole number).\n  4.3 Otherwise, if the first item of p equals the text 'remove':\n    4.3.1 If (the value stored under item 1 of p in inv (or 0 if it is missing)) is at least (item 2 of p as a whole number):\n      4.3.1.1 Decrease item (item 1 of p) of inv by item 2 of p as a whole number.\n    4.3.2 Otherwise:\n      4.3.2.1 Display the text 'Insufficient', item 1 of p, with a space between the values.\n5 For each k in inv in ascending order:\n  5.1 Display k, item k of inv, with a space between the values.\n6 End", "Roman Numeral to Integer": "1 Start\n2 Read one line of text typed by the user into s.\n3 Set v to a dictionary pairing the text 'I' with 1, the text 'V' with 5, the text 'X' with 10, the text 'L' with 50, the text 'C' with 100, the text 'D' with 500, the text 'M' with 1000.\n4 Set total to 0.\n5 For each i taking the whole numbers from 0 up to one less than (the number of items in s):\n  5.1 If (i plus 1) is less than (the number of items in s) as well as item (item i of s) of v is less than item (item (i plus 1) of s) of v:\n    5.1.1 Decrease total by item (item i of s) of v.\n  5.2 Otherwise:\n    5.2.1 Increase total by item (item i of s) of v.\n6 Display total.\n7 End", "Student Grade Book": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set d to an empty dictionary.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, m.\n  4.2 Add m as a whole number to the end of the list setdefault applied to d with name, an empty list.\n5 For each name in d in ascending order:\n  5.1 Display name, (the total of item name of d) divided by (the number of items in item name of d), the largest item of item name of d, with a space between the values.\n6 End", "Shortest Path in a Graph (BFS)": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set g to an empty dictionary.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in a, b.\n  4.2 Add b to the end of the list setdefault applied to g with a, an empty list.\n  4.3 Add a to the end of the list setdefault applied to g with b, an empty list.\n5 Read one line of text, then break it into words stored in s, t.\n6 Set dist to a dictionary pairing s with 0.\n7 Set q to a list holding s.\n8 While q, repeat the following:\n  8.1 Set u to the first item removed from q.\n  8.2 For each v in the value stored under u in g (or an empty list if it is missing):\n    8.2.1 If v is not found in dist:\n      8.2.1.1 Set item v of dist to (item u of dist) plus 1.\n      8.2.1.2 Add v to the end of the list q.\n9 Display the value stored under t in dist (or the text 'No path' if it is missing).\n10 End", "Spending Summary": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set t to an empty dictionary.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in c, a.\n  4.2 Set item c of t to (the value stored under c in t (or 0 if it is missing)) plus (a as a decimal number).\n5 For each c, a in (the key-value pairs of t) in ascending order by a rule that takes p giving a group holding (negative item 1 of p), the first item of p:\n  5.1 Display c, a, with a space between the values.\n6 Display the text 'Top:', the item of t with the largest value under get of t, with a space between the values.\n7 End", "Phone Book Search": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set book to an empty dictionary.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, num.\n  4.2 Set item name of book to num.\n5 For each q in (the next line typed by the user) broken into words:\n  5.1 Display q, the text '->', the value stored under q in book (or the text 'Not found' if it is missing), with a space between the values.\n6 End", "LRU Cache Simulator": "1 Start\n2 Read a whole number typed by the user into cap.\n3 Set cache to an empty list.\n4 Set data to an empty dictionary.\n5 Repeat the following as many times as the whole number typed by the user:\n  5.1 Read one line of text, then break it into words stored in p.\n  5.2 If the first item of p equals the text 'put':\n    5.2.1 If item 1 of p is found in data:\n      5.2.1.1 Remove item 1 of p from cache.\n    5.2.2 Otherwise, if (the number of items in cache) equals cap:\n      5.2.2.1 Set old to the first item removed from cache.\n      5.2.2.2 Remove item old of data.\n    5.2.3 Add item 1 of p to the end of the list cache.\n    5.2.4 Set item (item 1 of p) of data to item 2 of p.\n  5.3 Otherwise, if item 1 of p is found in data:\n    5.3.1 Remove item 1 of p from cache.\n    5.3.2 Add item 1 of p to the end of the list cache.\n    5.3.3 Display item (item 1 of p) of data.\n  5.4 Otherwise:\n    5.4.1 Display negative 1.\n6 End", "Count Unique Items": "1 Start\n2 Display the number of items in (the distinct items of ((the next line typed by the user) broken into words)).\n3 End", "Union of Two Sets": "1 Start\n2 Read one line of items, then keep the distinct ones in the set a.\n3 Read one line of items, then keep the distinct ones in the set b.\n4 Display (every item found in a or in b) in ascending order.\n5 End", "Common Elements": "1 Start\n2 Read one line of items, then keep the distinct ones in the set a.\n3 Read one line of items, then keep the distinct ones in the set b.\n4 Display (the items a shares with b) in ascending order.\n5 End", "Membership Test": "1 Start\n2 Read one line of items, then keep the distinct ones in the set s.\n3 If (the next line typed by the user) is found in s:\n  3.1 Display the text 'Yes'.\n4 Otherwise:\n  4.1 Display the text 'No'.\n5 End", "Symmetric Difference": "1 Start\n2 Read one line of items, then keep the distinct ones in the set a.\n3 Read one line of items, then keep the distinct ones in the set b.\n4 Display (the items found in exactly one of a, b) in ascending order.\n5 End", "Subset Check": "1 Start\n2 Read one line of items, then keep the distinct ones in the set a.\n3 Read one line of items, then keep the distinct ones in the set b.\n4 Display every item of a is found in b.\n5 End", "Letters Only in First Word": "1 Start\n2 Read one line of text typed by the user into a.\n3 Read one line of text typed by the user into b.\n4 Display ((the distinct items of a) minus (the distinct items of b)) in ascending order.\n5 End", "Pangram Check": "1 Start\n2 Set s to the distinct items of ((the next line typed by the user) in lower case).\n3 If every item of (the distinct items of the text 'abcdefghijklmnopqrstuvwxyz') is found in s:\n  3.1 Display the text 'Pangram'.\n4 Otherwise:\n  4.1 Display the text 'Not pangram'.\n5 End", "First Duplicate": "1 Start\n2 Set seen to an empty set.\n3 For each x in (the next line typed by the user) broken into words:\n  3.1 If x is found in seen:\n    3.1.1 Display x.\n    3.1.2 Leave the loop.\n  3.2 Put x into the set seen.\n4 If the loop ended without being cut short:\n  4.1 Display the text 'None'.\n5 End", "Longest Consecutive Run": "1 Start\n2 Set a to the distinct items of (every item of ((the next line typed by the user) broken into words) converted to a whole number).\n3 Set best to 0.\n4 For each x in a:\n  4.1 If (x minus 1) is not found in a:\n    4.1.1 Set y to x.\n    4.1.2 While (y plus 1) is found in a, repeat the following:\n      4.1.2.1 Increase y by 1.\n    4.1.3 Set best to the largest of best, ((y minus x) plus 1).\n5 Display best.\n6 End", "Jaccard Similarity": "1 Start\n2 Read one line of items, then keep the distinct ones in the set a.\n3 Read one line of items, then keep the distinct ones in the set b.\n4 Display ((the number of items in (the items a shares with b)) divided by (the number of items in (every item found in a or in b))) rounded to 2 decimal places.\n5 End", "Letters Common to All Words": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Set common to the distinct items of the first item of w.\n4 For each x in the items of w from position 1 onward:\n  4.1 Set common to the items common shares with (the distinct items of x).\n5 Display common in ascending order.\n6 End", "Friend Suggestions": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set fr to an empty dictionary.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in a, b.\n  4.2 Put b into the set setdefault applied to fr with a, (an empty set).\n  4.3 Put a into the set setdefault applied to fr with b, (an empty set).\n5 Read one line of text typed by the user into u.\n6 Set score to an empty dictionary.\n7 For each f in item u of fr:\n  7.1 For each ff in item f of fr:\n    7.1.1 If ff is not equal to u:\n      7.1.1.1 If ff is not found in item u of fr:\n        7.1.1.1.1 Set item ff of score to (the value stored under ff in score (or 0 if it is missing)) plus 1.\n8 For each p in score in ascending order by a rule that takes x giving a group holding (negative item x of score), x:\n  8.1 Display p, item p of score, with a space between the values.\n9 End", "4x4 Sudoku Validator": "1 Start\n2 Read 4 lines, each broken into words into the list g.\n3 Set ok to true.\n4 Set full to the distinct items of the text '1234'.\n5 For each i taking the whole numbers from 0 up to 4 - 1:\n  5.1 If (the distinct items of item i of g) is not equal to full or (the distinct items of (the values of item i of item r of g for each r in the whole numbers from 0 up to 4 - 1)) is not equal to full:\n    5.1.1 Set ok to false.\n6 For each r in a group holding 0, 2:\n  6.1 For each c in a group holding 0, 2:\n    6.1.1 Set box to the distinct items of ((((item c of item r of g) plus (item (c plus 1) of item r of g)) plus (item c of item (r plus 1) of g)) plus (item (c plus 1) of item (r plus 1) of g)).\n    6.1.2 If box is not equal to full:\n      6.1.2.1 Set ok to false.\n7 If ok:\n  7.1 Display the text 'Valid'.\n8 Otherwise:\n  8.1 Display the text 'Invalid'.\n9 End", "Words Unique to Each Sentence": "1 Start\n2 Set a to the distinct items of (((the next line typed by the user) in lower case) broken into words).\n3 Set b to the distinct items of (((the next line typed by the user) in lower case) broken into words).\n4 Display (a minus b) in ascending order.\n5 Display (b minus a) in ascending order.\n6 End", "Friend Groups (Connected Components)": "1 Start\n2 Set groups to an empty list.\n3 Repeat the following as many times as the whole number typed by the user:\n  3.1 Read one line of text, then break it into words stored in a, b.\n  3.2 Set merged to a set holding a, b.\n  3.3 Set rest to an empty list.\n  3.4 For each g in groups:\n    3.4.1 If the items g shares with merged:\n      3.4.1.1 Set merged to every item found in merged or in g.\n    3.4.2 Otherwise:\n      3.4.2.1 Add g to the end of the list rest.\n  3.5 Add merged to the end of the list rest.\n  3.6 Set groups to rest.\n4 Display the number of items in groups.\n5 For each g in groups in ascending order by a rule that takes x giving x in ascending order:\n  5.1 Display g in ascending order.\n6 End", "Find All Numbers": "1 Start\n2 Make the pattern-matching tools available.\n3 Display all matches of the pattern '\\d+' in (the next line typed by the user).\n4 End", "All Digits?": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 If a match of the pattern '^\\d+$' at the start of s:\n  4.1 Display the text 'Digits only'.\n5 Otherwise:\n  5.1 Display the text 'Not only digits'.\n6 End", "Collapse Spaces": "1 Start\n2 Make the pattern-matching tools available.\n3 Display (the next line typed by the user) with every match of the pattern '\\s+' replaced by a space.\n4 End", "Starts with Capital": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 If a match of the pattern '[A-Z]' at the start of s:\n  4.1 Display the text 'Yes'.\n5 Otherwise:\n  5.1 Display the text 'No'.\n6 End", "Simple Email Check": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 Set ok to a match of the pattern '^[\\w.]+@\\w+\\.[a-z]+$' at the start of s.\n5 If ok:\n  5.1 Display the text 'Valid'.\n6 Otherwise:\n  6.1 Display the text 'Invalid'.\n7 End", "Split into Words": "1 Start\n2 Make the pattern-matching tools available.\n3 Set w to the list of x for each x in (the next line typed by the user) cut at every match of the pattern '[^A-Za-z]+', only when x.\n4 Display w.\n5 End", "Phone Number Check": "1 Start\n2 Make the pattern-matching tools available.\n3 If a match of the pattern '^\\d{3}-\\d{3}-\\d{4}$' at the start of (the next line typed by the user):\n  3.1 Display the text 'Valid'.\n4 Otherwise:\n  4.1 Display the text 'Invalid'.\n5 End", "Extract Emails": "1 Start\n2 Make the pattern-matching tools available.\n3 Display all matches of the pattern '[\\w.]+@\\w+\\.\\w+' in (the next line typed by the user).\n4 End", "Password Strength": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into p.\n4 Set checks to a list holding ((the number of items in p) is at least 8), (the first match of the pattern '[A-Z]' anywhere in p), (the first match of the pattern '[a-z]' anywhere in p), (the first match of the pattern '\\d' anywhere in p), (the first match of the pattern '[^\\w]' anywhere in p).\n5 If every item of checks is true:\n  5.1 Display the text 'Strong'.\n6 Otherwise:\n  6.1 Display the text 'Weak'.\n7 End", "Reformat a Date": "1 Start\n2 Make the pattern-matching tools available.\n3 Set m to the first match of the pattern '(\\d{4})-(\\d{2})-(\\d{2})' anywhere in (the next line typed by the user).\n4 If m:\n  4.1 Display ((((group 3 of the match m) followed by the text '/') followed by (group 2 of the match m)) followed by the text '/') followed by (group 1 of the match m).\n5 Otherwise:\n  5.1 Display the text 'No date found'.\n6 End", "Hashtags and Mentions": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 Display all matches of the pattern '#\\w+' in s.\n5 Display all matches of the pattern '@\\w+' in s.\n6 End", "IPv4 Address Validator": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 Set ok to (a match of the pattern '^\\d{1,3}(\\.\\d{1,3}){3}$' at the start of s) as true or false as well as every item of (the values of ((x as a whole number) is at most 255) for each x in s cut at every the text '.') is true.\n5 If ok:\n  5.1 Display the text 'Valid'.\n6 Otherwise:\n  6.1 Display the text 'Invalid'.\n7 End", "Expression Tokenizer": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 Set tokens to all matches of the pattern '\\d+\\.?\\d*|[-+*/()]' in s.\n5 Set nums to the list of t for each t in tokens, only when a match of the pattern '\\d' at the start of t.\n6 Set ops to the list of t for each t in tokens, only when t is found in the text '+-*/'.\n7 Display tokens.\n8 Display the text 'Numbers:', the number of items in nums, the text 'Operators:', the number of items in ops, with a space between the values.\n9 End", "Log Line Parser": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into line.\n4 Set m to a match of the pattern '^\\[(\\d{4}-\\d{2}-\\d{2}) (\\d{2}:\\d{2}:\\d{2})\\] (\\w+): (.*)$' at the start of line.\n5 If m:\n  5.1 Display the text 'Date:', group 1 of the match m, with a space between the values.\n  5.2 Display the text 'Time:', group 2 of the match m, with a space between the values.\n  5.3 Display the text 'Level:', group 3 of the match m, with a space between the values.\n  5.4 Display the text 'Message:', group 4 of the match m, with a space between the values.\n6 Otherwise:\n  6.1 Display the text 'Unrecognised format'.\n7 End", "Extract Prices": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 Set p to all matches of the pattern '\\d+\\.\\d{2}' in s.\n5 Display p.\n6 Display the total of (the values of (x as a decimal number) for each x in p).\n7 End", "Censor Words": "1 Start\n2 Make the pattern-matching tools available.\n3 Read one line of text typed by the user into s.\n4 Read one line of text, then break it into words stored in bad.\n5 For each b in bad:\n  5.1 Set s to s with every match of the pattern ((the text '\\b' followed by b) followed by the text '\\b') replaced by (the text '*' repeated (the number of items in b) times).\n6 Display s.\n7 End", "Count Lines, Words, Characters": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines of text into the list lines.\n4 Display the number of items in lines, the total of (the values of (the number of items in (l broken into words)) for each l in lines), the total of (the values of (the number of items in l) for each l in lines), with a space between the values.\n5 End", "Numbered Lines": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines of text into the list lines.\n4 For each i, l in lines with positions numbered from 1:\n  4.1 Display i, l, with a space between the values.\n5 End", "Uppercase Every Line": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each _ taking the whole numbers from 0 up to n - 1:\n  3.1 Display (the next line typed by the user) in upper case.\n4 End", "Search Keyword": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines of text into the list lines.\n4 Read one line of text typed by the user into key.\n5 For each i, l in lines with positions numbered from 1:\n  5.1 If key is found in l:\n    5.1.1 Display i, l, with a space between the values.\n6 End", "Longest Line": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines of text into the list lines.\n4 Set best to the first item of lines.\n5 For each l in lines:\n  5.1 If (the number of items in l) is greater than (the number of items in best):\n    5.1.1 Set best to l.\n6 Display best, the number of items in best, with a space between the values.\n7 End", "CSV Average Marks": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set total to 0.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then cut it at every comma, storing the pieces in name, m.\n  4.2 Increase total by m as a whole number.\n5 Display total divided by n.\n6 End", "Word Frequency in File": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set d to an empty dictionary.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 For each w in ((the next line typed by the user) in lower case) broken into words:\n    4.1.1 Set item w of d to (the value stored under w in d (or 0 if it is missing)) plus 1.\n5 For each w in d in ascending order:\n  5.1 Display w, item w of d, with a space between the values.\n6 End", "Log Level Counter": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set count to a dictionary pairing the text 'INFO' with 0, the text 'WARN' with 0, the text 'ERROR' with 0.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Set level to the first item of (the next line typed by the user) broken into words.\n  4.2 If level is found in count:\n    4.2.1 Increase item level of count by 1.\n5 For each k in count in ascending order:\n  5.1 Display k, item k of count, with a space between the values.\n6 End", "Remove Duplicate Lines": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set seen to an empty set.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text typed by the user into l.\n  4.2 If l is not found in seen:\n    4.2.1 Put l into the set seen.\n    4.2.2 Display l.\n5 End", "Student Report": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set best to an empty text.\n4 Set top to negative 1.\n5 For each _ taking the whole numbers from 0 up to n - 1:\n  5.1 Read one line of text, then cut it at every comma, storing the pieces in p.\n  5.2 Set t to (item 1 of p as a whole number) plus (item 2 of p as a whole number).\n  5.3 Display the first item of p, t, with a space between the values.\n  5.4 If t is greater than top:\n    5.4.1 Set top to t.\n    5.4.2 Set best to the first item of p.\n6 Display the text 'Top:', best, with a space between the values.\n7 End", "Find and Replace Text": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines of text into the list lines.\n4 Read one line of text typed by the user into old.\n5 Read one line of text typed by the user into new.\n6 Set count to 0.\n7 For each l in lines:\n  7.1 Increase count by the number of times old occurs in l.\n  7.2 Display l with every old replaced by new.\n8 Display the text 'Replacements:', count, with a space between the values.\n9 End", "CSV Column Averages": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines typed by the user into the list rows.\n4 For each c taking the whole numbers from 0 up to one less than (the number of items in the first item of rows):\n  4.1 Display the text 'Column', c plus 1, (the total of (the values of item c of r for each r in rows)) divided by n, with a space between the values.\n5 End", "Word Index (Inverted Index)": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set idx to an empty dictionary.\n4 For each i taking the whole numbers from 1 up to n (included):\n  4.1 For each w in the distinct items of (((the next line typed by the user) in lower case) broken into words):\n    4.1.1 Add i to the end of the list setdefault applied to idx with w, an empty list.\n5 For each w in idx in ascending order:\n  5.1 Display w, item w of idx, with a space between the values.\n6 End", "Merge Two Sorted Files": "1 Start\n2 Read the whole number typed by the user lines of text into the list a.\n3 Read the whole number typed by the user lines of text into the list b.\n4 Set every one of i, j to 0.\n5 Set out to an empty list.\n6 While i is less than (the number of items in a) as well as j is less than (the number of items in b), repeat the following:\n  6.1 If item i of a is at most item j of b:\n    6.1.1 Add item i of a to the end of the list out.\n    6.1.2 Increase i by 1.\n  6.2 Otherwise:\n    6.2.1 Add item j of b to the end of the list out.\n    6.2.2 Increase j by 1.\n7 Increase out by (the items of a from position i onward) plus (the items of b from position j onward).\n8 For each l in out:\n  8.1 Display l.\n9 End", "Trim and Drop Blank Lines": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set out to an empty list.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then remove surrounding spaces, storing it in l.\n  4.2 If l:\n    4.2.1 Add l to the end of the list out.\n5 Display the number of items in out, the text 'non-empty lines', with a space between the values.\n6 For each l in out:\n  6.1 Display l.\n7 End", "Report Card from CSV": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read one line of text, then cut it at every comma, storing the pieces in head.\n4 Read n lines, each cut at commas into the list rows.\n5 Set totals to an empty list.\n6 For each r in rows:\n  6.1 Set marks to the list of (x as a whole number) for each x in the items of r from position 1 onward.\n  6.2 Add a group holding the first item of r, (the total of marks), ((the total of marks) divided by (the number of items in marks)) to the end of the list totals.\n7 For each name, t, avg in totals:\n  7.1 Display name, t, avg rounded to 1 decimal places, with a space between the values.\n8 Set best to the item of totals with the largest value under a rule that takes x giving item 1 of x.\n9 Display the text 'Best:', the first item of best, the text 'Class average:', ((the total of (the values of item 1 of t for each t in totals)) divided by n) rounded to 1 decimal places, with a space between the values.\n10 End", "Safe Integer Conversion": "1 Start\n2 Try the following:\n  2.1 Read a whole number typed by the user into n.\n  2.2 Display the text 'Number:', n, with a space between the values.\n3 If an invalid value occurs:\n  3.1 Display the text 'Invalid number'.\n4 End", "Safe Division": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n3 Try the following:\n  3.1 Display a divided by b.\n4 If a division by zero occurs:\n  4.1 Display the text 'Cannot divide by zero'.\n5 End", "Safe List Index": "1 Start\n2 Set a to a list holding 10, 20, 30.\n3 Read a whole number typed by the user into i.\n4 Try the following:\n  4.1 Display item i of a.\n5 If an index outside the list occurs:\n  5.1 Display the text 'Index out of range'.\n6 End", "Safe Dictionary Lookup": "1 Start\n2 Set d to a dictionary pairing the text 'a' with 1, the text 'b' with 2.\n3 Read one line of text typed by the user into k.\n4 Try the following:\n  4.1 Display item k of d.\n5 If a missing key occurs:\n  5.1 Display the text 'Key not found'.\n6 End", "Multiple Except + Finally": "1 Start\n2 Try the following:\n  2.1 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n  2.2 Set r to the whole-number part of a divided by b.\n3 If an invalid value occurs:\n  3.1 Display the text 'Bad input'.\n4 If a division by zero occurs:\n  4.1 Display the text 'Zero divisor'.\n5 If no error occurred:\n  5.1 Display the text 'Result', r, with a space between the values.\n6 In every case, whether or not an error occurred:\n  6.1 Display the text 'Done'.\n7 End", "Custom Exception": "1 Start\n2 Define a new kind of error named NegativeError (based on Exception):\n  2.1 Do nothing.\n3 Read a whole number typed by the user into n.\n4 Try the following:\n  4.1 If n is less than 0:\n    4.1.1 Signal an error: the result of NegativeError for the text 'negative not allowed'.\n  4.2 Display the text 'Square root approx', n raised to the power 0.5, with a space between the values.\n5 If NegativeError occurs:\n  5.1 Display the text 'Error:', e, with a space between the values.\n6 End", "Retry Until Valid": "1 Start\n2 Set attempts to 0.\n3 Keep repeating the following until it is told to stop:\n  3.1 Increase attempts by 1.\n  3.2 Try the following:\n    3.2.1 Read a whole number typed by the user into n.\n    3.2.2 Leave the loop.\n  3.3 If an invalid value occurs:\n    3.3.1 Display the text 'Try again'.\n4 Display n, the text 'after', attempts, the text 'attempts', with a space between the values.\n5 End", "Validate Age": "1 Start\n2 Define a reusable function named check that takes age:\n  2.1 If age is less than 0:\n    2.1.1 Signal an error: the result of ValueError for the text 'Age cannot be negative'.\n  2.2 If age is greater than 120:\n    2.2.1 Signal an error: the result of ValueError for the text 'Age is unrealistic'.\n  2.3 Give back age.\n3 Try the following:\n  3.1 Display the text 'Valid', the result of check for (the whole number typed by the user), with a space between the values.\n4 If an invalid value occurs:\n  4.1 Display the text 'Error:', e, with a space between the values.\n5 End", "Bank Withdrawal": "1 Start\n2 Define a new kind of error named InsufficientFunds (based on Exception):\n  2.1 Define a reusable function named __init__ that takes self, balance:\n    2.1.1 Set balance of self to balance.\n3 Set balance to 500.\n4 Try the following:\n  4.1 Read a whole number typed by the user into amt.\n  4.2 If amt is greater than balance:\n    4.2.1 Signal an error: the result of InsufficientFunds for balance.\n  4.3 Decrease balance by amt.\n  4.4 Display the text 'New balance', balance, with a space between the values.\n5 If InsufficientFunds occurs:\n  5.1 Display the text 'Insufficient funds, balance is', balance of e, with a space between the values.\n6 If an invalid value occurs:\n  6.1 Display the text 'Enter a number'.\n7 End", "Safe Calculator": "1 Start\n2 Try the following:\n  2.1 Read one line of text, then break it into words stored in a, op, b.\n  2.2 Set at the same time: a to a as a decimal number, b to b as a decimal number.\n  2.3 If op equals the text '+':\n    2.3.1 Display a plus b.\n  2.4 Otherwise, if op equals the text '-':\n    2.4.1 Display a minus b.\n  2.5 Otherwise, if op equals the text '*':\n    2.5.1 Display a times b.\n  2.6 Otherwise, if op equals the text '/':\n    2.6.1 Display a divided by b.\n  2.7 Otherwise:\n    2.7.1 Signal an error: the result of ValueError for the text 'unknown operator'.\n3 If a division by zero occurs:\n  3.1 Display the text 'Division by zero'.\n4 If an invalid value occurs:\n  4.1 Display the text 'Invalid input'.\n5 End", "Sum Valid Numbers": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set total to 0.\n4 Set bad to 0.\n5 For each _ taking the whole numbers from 0 up to n - 1:\n  5.1 Try the following:\n    5.1.1 Increase total by the decimal number typed by the user.\n  5.2 If an invalid value occurs:\n    5.2.1 Increase bad by 1.\n6 Display the text 'Sum:', total, the text 'Invalid:', bad, with a space between the values.\n7 End", "try / except / else / finally Flow": "1 Start\n2 Define a reusable function named f that takes x:\n  2.1 Try the following:\n    2.1.1 Display the text 'try'.\n    2.1.2 Set r to the whole-number part of 10 divided by x.\n  2.2 If a division by zero occurs:\n    2.2.1 Display the text 'except'.\n    2.2.2 Give back negative 1.\n  2.3 If no error occurred:\n    2.3.1 Display the text 'else'.\n    2.3.2 Give back r.\n  2.4 In every case, whether or not an error occurred:\n    2.4.1 Display the text 'finally'.\n3 Display the result of f for (the whole number typed by the user).\n4 End", "ATM Simulator": "1 Start\n2 Define a new kind of error named ATMError (based on Exception):\n  2.1 Do nothing.\n3 Define a new kind of error named InsufficientFunds (based on ATMError):\n  3.1 Do nothing.\n4 Define a new kind of error named InvalidAmount (based on ATMError):\n  4.1 Do nothing.\n5 Set balance to 1000.\n6 Repeat the following as many times as the whole number typed by the user:\n  6.1 Read one line of text, then break it into words stored in cmd, amt.\n  6.2 Try the following:\n    6.2.1 Set amt to amt as a whole number.\n    6.2.2 If amt is at most 0:\n      6.2.2.1 Signal an error: the result of InvalidAmount for the text 'amount must be positive'.\n    6.2.3 If cmd equals the text 'withdraw':\n      6.2.3.1 If amt is greater than balance:\n        6.2.3.1.1 Signal an error: the result of InsufficientFunds for (the text 'balance is ' followed by (balance written as text)).\n      6.2.3.2 Decrease balance by amt.\n    6.2.4 Otherwise, if cmd equals the text 'deposit':\n      6.2.4.1 Increase balance by amt.\n    6.2.5 Otherwise:\n      6.2.5.1 Signal an error: the result of ATMError for the text 'unknown command'.\n    6.2.6 Display the text 'OK', balance, with a space between the values.\n  6.3 If ATMError occurs:\n    6.3.1 Display the text 'Error:', e, with a space between the values.\n  6.4 If an invalid value occurs:\n    6.4.1 Display the text 'Error: not a number'.\n7 End", "Matrix Multiply with Errors": "1 Start\n2 Define a new kind of error named DimError (based on Exception):\n  2.1 Do nothing.\n3 Define a reusable function named mul that takes a, b:\n  3.1 If (the number of items in the first item of a) is not equal to (the number of items in b):\n    3.1.1 Signal an error: the result of DimError for (((((((the text 'cannot multiply ' followed by ((the number of items in a) written as text)) followed by the text 'x') followed by ((the number of items in the first item of a) written as text)) followed by the text ' by ') followed by ((the number of items in b) written as text)) followed by the text 'x') followed by ((the number of items in the first item of b) written as text)).\n  3.2 Give back the list of (the list of (the total of (the values of ((item k of item i of a) times (item j of item k of b)) for each k in the whole numbers from 0 up to one less than (the number of items in b))) for each j in the whole numbers from 0 up to one less than (the number of items in the first item of b)) for each i in the whole numbers from 0 up to one less than (the number of items in a).\n4 Define a reusable function named read:\n  4.1 Read a whole number typed by the user into r.\n  4.2 Give back the list of ((every item of ((the next line typed by the user) broken into words) converted to a whole number) as a list) for each _ in the whole numbers from 0 up to r - 1.\n5 Set a to the result of read.\n6 Set b to the result of read.\n7 Try the following:\n  7.1 Display the result of mul for a, b.\n8 If DimError occurs:\n  8.1 Display the text 'Error:', e, with a space between the values.\n9 End", "Safe Average": "1 Start\n2 Read one line of text, then break it into words stored in vals.\n3 Set ok to an empty list.\n4 For each v in vals:\n  4.1 Try the following:\n    4.1.1 Add v as a decimal number to the end of the list ok.\n  4.2 If an invalid value occurs:\n    4.2.1 Display the text 'Skipping', v, with a space between the values.\n5 If ok:\n  5.1 Display (the total of ok) divided by (the number of items in ok).\n6 Otherwise:\n  6.1 Display the text 'No valid numbers'.\n7 End", "Stack with Error Handling": "1 Start\n2 Define a new kind of error named EmptyStack (based on Exception):\n  2.1 Do nothing.\n3 Set stack to an empty list.\n4 Repeat the following as many times as the whole number typed by the user:\n  4.1 Read one line of text, then break it into words stored in p.\n  4.2 Try the following:\n    4.2.1 If the first item of p equals the text 'push':\n      4.2.1.1 Add item 1 of p as a whole number to the end of the list stack.\n    4.2.2 Otherwise, if the first item of p equals the text 'pop':\n      4.2.2.1 If not (stack):\n        4.2.2.1.1 Signal an error: the result of EmptyStack for the text 'stack is empty'.\n      4.2.2.2 Display the last item removed from stack.\n    4.2.3 Otherwise, if the first item of p equals the text 'peek':\n      4.2.3.1 If not (stack):\n        4.2.3.1.1 Signal an error: the result of EmptyStack for the text 'stack is empty'.\n      4.2.3.2 Display the last item of stack.\n    4.2.4 Otherwise:\n      4.2.4.1 Signal an error: the result of ValueError for the text 'unknown command'.\n  4.3 If EmptyStack occurs:\n    4.3.1 Display the text 'Error:', e, with a space between the values.\n  4.4 If an invalid value or an index outside the list occurs:\n    4.4.1 Display the text 'Error: bad command'.\n5 End", "Add Two Numbers": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n3 Display a plus b.\n4 End", "Greeting and Length": "1 Start\n2 Read one line of text typed by the user into name.\n3 Display the text 'Hello,', name, with a space between the values.\n4 Display the number of items in name.\n5 End", "Print 1 to n on One Line": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display i, then a space, without moving to a new line.\n4 Move to a new line.\n5 End", "Sort Numbers": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Display a in ascending order.\n4 Display a in descending order.\n5 End", "Find All Positions": "1 Start\n2 Read one line of text, then break it into words stored in a.\n3 Read one line of text typed by the user into t.\n4 For each i, v in a with positions numbered from 0:\n  4.1 If v equals t:\n    4.1.1 Display i.\n5 End", "Squares of Even Numbers": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set ev to (the items of a that satisfy a rule that takes x giving (the remainder when x is divided by 2) equals 0) as a list.\n4 Display (the result of applying a rule that takes x giving x times x to every item of ev) as a list.\n5 End", "Pair Two Lists": "1 Start\n2 Read one line of text, then break it into words stored in a.\n3 Read one line of text, then break it into words stored in b.\n4 Display (the items of a paired with those of b) as a list.\n5 End", "Row and Column Sums": "1 Start\n2 Read a whole number typed by the user into r.\n3 Read r lines of whole numbers (one list per line) into the list m.\n4 Display the list of (the total of row) for each row in m.\n5 Display the list of (the total of c) for each c in the items of the items of m.\n6 End", "Rank Students": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set s to an empty list.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, m.\n  4.2 Add a group holding name, (m as a whole number) to the end of the list s.\n5 For each rank, (name, m) in (s in ascending order by a rule that takes p giving negative item 1 of p) with positions numbered from 1:\n  5.1 Display rank, name, m, with a space between the values.\n6 End", "Number Statistics": "1 Start\n2 Set a to (every item of ((the next line typed by the user) broken into words) converted to a whole number) in ascending order.\n3 Set n to the number of items in a.\n4 If the remainder when n is divided by 2:\n  4.1 Set med to item (the whole-number part of n divided by 2) of a.\n5 Otherwise:\n  5.1 Set med to ((item ((the whole-number part of n divided by 2) minus 1) of a) plus (item (the whole-number part of n divided by 2) of a)) divided by 2.\n6 Display the smallest item of a, the largest item of a, (the total of a) divided by n, med, with a space between the values.\n7 End", "Histogram Printer": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 For each i, x in a with positions numbered from 1:\n  3.1 Display i, the text '*' repeated x times, with a space between the values.\n4 End", "Running Totals": "1 Start\n2 Read one line of whole numbers separated by spaces into the list a.\n3 Set t to 0.\n4 Set out to an empty list.\n5 For each x in a:\n  5.1 Increase t by x.\n  5.2 Add t to the end of the list out.\n6 Display out.\n7 End", "Pascal's Triangle": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set row to a list holding 1.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Display the items of (every item of row converted to text) joined with a space placed between them.\n  4.2 Set row to (a list holding 1 plus (the list of ((item i of row) plus (item (i plus 1) of row)) for each i in the whole numbers from 0 up to one less than ((the number of items in row) minus 1))) plus a list holding 1.\n5 End", "Formatted Invoice": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set total to 0.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, q, p.\n  4.2 Set amt to (q as a whole number) times (p as a decimal number).\n  4.3 Increase total by amt.\n  4.4 Display name padded on the right to a width of 10, q padded on the left to a width of 3, the remainder when the text '%.2f' is divided by amt, with a space between the values.\n5 Display the text 'TOTAL' padded on the right to a width of 10, the text '   ', the remainder when the text '%.2f' is divided by total, with a space between the values.\n6 End", "Temperature Table": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in lo, hi, step in order.\n3 Display the text 'C', the text 'F', with a space between the values.\n4 For each c taking the whole numbers from lo towards hi plus 1 (excluded) in steps of step:\n  4.1 Display c, (((c times 9) divided by 5) plus 32) rounded to 1 decimal places, with a space between the values.\n5 End", "Bill with Discount and Tax": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set sub to 0.\n4 For each _ taking the whole numbers from 0 up to n - 1:\n  4.1 Read one line of text, then break it into words stored in name, q, p.\n  4.2 Increase sub by (q as a whole number) times (p as a decimal number).\n5 If sub is greater than 1000:\n  5.1 Set disc to sub times 0.1.\n6 Otherwise:\n  6.1 Set disc to 0.\n7 Set tax to (sub minus disc) times 0.05.\n8 Display the text 'Subtotal:', sub rounded to 2 decimal places, with a space between the values.\n9 Display the text 'Discount:', disc rounded to 2 decimal places, with a space between the values.\n10 Display the text 'Tax:', tax rounded to 2 decimal places, with a space between the values.\n11 Display the text 'Total:', ((sub minus disc) plus tax) rounded to 2 decimal places, with a space between the values.\n12 End", "Type Converter": "1 Start\n2 Read one line of text typed by the user into x.\n3 Display x as a whole number, x as a decimal number, x written as text, (x as a whole number) as true or false, with a space between the values.\n4 End", "Rectangle Area and Perimeter": "1 Start\n2 Read one line of numbers separated by spaces, then store them in l, w in order.\n3 Display l times w, 2 times (l plus w), with a space between the values.\n4 End", "Celsius to Fahrenheit": "1 Start\n2 Read a decimal number typed by the user into c.\n3 Display ((c times 9) divided by 5) plus 32.\n4 End", "Quotient and Remainder": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n3 Set q, r to the quotient together with the remainder of a divided by b.\n4 Display q, r, with a space between the values.\n5 End", "Compound Interest": "1 Start\n2 Read one line of numbers separated by spaces, then store them in p, r, t in order.\n3 Display (p times ((1 plus (r divided by 100)) raised to the power t)) rounded to 2 decimal places.\n4 End", "Number Base Converter": "1 Start\n2 Read a whole number typed by the user into n.\n3 Display the result of bin for n, the result of oct for n, the result of hex for n, with a space between the values.\n4 End", "Hypotenuse": "1 Start\n2 Make the mathematics tools available.\n3 Read one line of numbers separated by spaces, then store them in a, b in order.\n4 Display (the square root of ((a times a) plus (b times b))) rounded to 2 decimal places.\n5 End", "GCD and LCM": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n3 Set at the same time: x to a, y to b.\n4 While y, repeat the following:\n  4.1 Set at the same time: x to y, y to the remainder when x is divided by y.\n5 Display x, the whole-number part of (a times b) divided by x, with a space between the values.\n6 End", "Quadratic Roots": "1 Start\n2 Make the mathematics tools available.\n3 Read one line of numbers separated by spaces, then store them in a, b, c in order.\n4 Set d to (b times b) minus ((4 times a) times c).\n5 If d is less than 0:\n  5.1 Display the text 'No real roots'.\n6 Otherwise, if d equals 0:\n  6.1 Display (negative b) divided by (2 times a).\n7 Otherwise:\n  7.1 Set r to the square root of d.\n  7.2 Display ((negative b) plus r) divided by (2 times a), ((negative b) minus r) divided by (2 times a), with a space between the values.\n8 End", "Decimal to Binary": "1 Start\n2 Read a whole number typed by the user into n.\n3 If n equals 0:\n  3.1 Display 0.\n4 Otherwise:\n  4.1 Set s to an empty text.\n  4.2 While n is greater than 0, repeat the following:\n    4.2.1 Set s to ((the remainder when n is divided by 2) written as text) followed by s.\n    4.2.2 Divide n by 2, keeping the whole-number part.\n  4.3 Display s.\n5 End", "Simplify a Fraction": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n3 Set at the same time: x to a, y to b.\n4 While y, repeat the following:\n  4.1 Set at the same time: x to y, y to the remainder when x is divided by y.\n5 Display (((the whole-number part of a divided by x) written as text) followed by the text '/') followed by ((the whole-number part of b divided by x) written as text).\n6 End", "Currency Change Maker": "1 Start\n2 Read a whole number typed by the user into amt.\n3 For each c in a group holding 2000, 500, 100, 50, 20, 10, 5, 2, 1:\n  3.1 Set k to the whole-number part of amt divided by c.\n  3.2 If k:\n    3.2.1 Display c, the text 'x', k, with a space between the values.\n  3.3 Replace amt with the remainder when it is divided by c.\n4 End", "Square Root by Newton's Method": "1 Start\n2 Read a decimal number typed by the user into n.\n3 Set x to n.\n4 For each i taking the whole numbers from 0 up to 20 - 1:\n  4.1 Set x to (x plus (n divided by x)) divided by 2.\n5 Display x rounded to 4 decimal places.\n6 End", "Convert to Any Base": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in n, b in order.\n3 Set digits to the text '0123456789ABCDEF'.\n4 If n equals 0:\n  4.1 Display the text '0'.\n5 Otherwise:\n  5.1 Set s to an empty text.\n  5.2 While n is greater than 0, repeat the following:\n    5.2.1 Set s to (item (the remainder when n is divided by b) of digits) plus s.\n    5.2.2 Divide n by b, keeping the whole-number part.\n  5.3 Display s.\n6 End", "Mean and Standard Deviation": "1 Start\n2 Read one line of numbers separated by spaces into the list a.\n3 Set m to (the total of a) divided by (the number of items in a).\n4 Set v to (the total of (the values of ((x minus m) raised to the power 2) for each x in a)) divided by (the number of items in a).\n5 Display m rounded to 2 decimal places, (v raised to the power 0.5) rounded to 2 decimal places, with a space between the values.\n6 End", "Add Two Fractions": "1 Start\n2 Read one line of whole numbers separated by spaces, then store them in a, b, c, d in order.\n3 Set at the same time: n to (a times d) plus (c times b), m to b times d.\n4 Set at the same time: x to n, y to m.\n5 While y, repeat the following:\n  5.1 Set at the same time: x to y, y to the remainder when x is divided by y.\n6 Display (((the whole-number part of n divided by x) written as text) followed by the text '/') followed by ((the whole-number part of m divided by x) written as text).\n7 End", "Square Function": "1 Start\n2 Define a reusable function named square that takes x:\n  2.1 Give back x times x.\n3 Display the result of square for (the whole number typed by the user).\n4 End", "Bigger of Two": "1 Start\n2 Define a reusable function named bigger that takes a, b:\n  2.1 If a is greater than b:\n    2.1.1 Give back a.\n  2.2 Otherwise:\n    2.2.1 Give back b.\n3 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n4 Display the result of bigger for a, b.\n5 End", "Greeting with Default": "1 Start\n2 Define a reusable function named greet that takes name, greeting:\n  2.1 Give back (greeting followed by the text ', ') followed by name.\n3 Read one line of text typed by the user into name.\n4 Display the result of greet for name.\n5 Display the result of greet for name, the text 'Hi'.\n6 End", "Is Even": "1 Start\n2 Define a reusable function named is_even that takes n:\n  2.1 Give back (the remainder when n is divided by 2) equals 0.\n3 Display the result of is_even for (the whole number typed by the user).\n4 End", "Factorial (Recursion)": "1 Start\n2 Define a reusable function named fact that takes n:\n  2.1 If n is at most 1:\n    2.1.1 Give back 1.\n  2.2 Give back n times (the result of fact for (n minus 1)).\n3 Display the result of fact for (the whole number typed by the user).\n4 End", "Sum with *args": "1 Start\n2 Define a reusable function named total that takes any number of extra values called nums:\n  2.1 Give back the total of nums.\n3 Read one line of whole numbers separated by spaces into the list a.\n4 Display the result of total for the items of a.\n5 End", "Sort by Last Letter": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Sort the list w in ascending order by a rule that takes s giving the last item of s.\n4 Display w.\n5 End", "Fibonacci with Memoization": "1 Start\n2 Set memo to an empty dictionary.\n3 Define a reusable function named fib that takes n:\n  3.1 If n is less than 2:\n    3.1.1 Give back n.\n  3.2 If n is not found in memo:\n    3.2.1 Set item n of memo to (the result of fib for (n minus 1)) plus (the result of fib for (n minus 2)).\n  3.3 Give back item n of memo.\n4 Display the result of fib for (the whole number typed by the user).\n5 End", "Closure Multiplier": "1 Start\n2 Define a reusable function named make_multiplier that takes k:\n  2.1 Define a reusable function named mul that takes x:\n    2.1.1 Give back x times k.\n  2.2 Give back mul.\n3 Read a whole number typed by the user into k.\n4 Set f to the result of make_multiplier for k.\n5 Display the list of (the result of f for i) for each i in the whole numbers from 1 up to 6 - 1.\n6 End", "Tower of Hanoi": "1 Start\n2 Define a reusable function named hanoi that takes n, a, b, c:\n  2.1 If n equals 0:\n    2.1.1 Give back 0.\n  2.2 Set m to the result of hanoi for (n minus 1), a, c, b.\n  2.3 Display the text 'Move disk', n, the text 'from', a, the text 'to', c, with a space between the values.\n  2.4 Give back (m plus 1) plus (the result of hanoi for (n minus 1), b, a, c).\n3 Read a whole number typed by the user into n.\n4 Display the text 'Total moves:', the result of hanoi for n, the text 'A', the text 'B', the text 'C', with a space between the values.\n5 End", "Binary Search Function": "1 Start\n2 Define a reusable function named bsearch that takes a, t:\n  2.1 Set at the same time: lo to 0, hi to (the number of items in a) minus 1.\n  2.2 While lo is at most hi, repeat the following:\n    2.2.1 Set mid to the whole-number part of (lo plus hi) divided by 2.\n    2.2.2 If item mid of a equals t:\n      2.2.2.1 Give back mid.\n    2.2.3 If item mid of a is less than t:\n      2.2.3.1 Set lo to mid plus 1.\n    2.2.4 Otherwise:\n      2.2.4.1 Set hi to mid minus 1.\n  2.3 Give back negative 1.\n3 Read one line of whole numbers separated by
