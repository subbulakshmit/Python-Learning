spaces into the list a.\n4 Display the result of bsearch for a, (the whole number typed by the user).\n5 End", "Fast Exponentiation": "1 Start\n2 Define a reusable function named power that takes b, e:\n  2.1 If e equals 0:\n    2.1.1 Give back 1.\n  2.2 Set half to the result of power for b, (the whole-number part of e divided by 2).\n  2.3 If (the remainder when e is divided by 2) equals 0:\n    2.3.1 Give back half times half.\n  2.4 Give back (half times half) times b.\n3 Read one line of whole numbers separated by spaces, then store them in b, e in order.\n4 Display the result of power for b, e.\n5 End", "Permutations of a String": "1 Start\n2 Define a reusable function named perms that takes s:\n  2.1 If (the number of items in s) is at most 1:\n    2.1.1 Give back a list holding s.\n  2.2 Set out to an empty list.\n  2.3 For each i taking the whole numbers from 0 up to one less than (the number of items in s):\n    2.3.1 For each p in the result of perms for ((the first i items of s) plus (the items of s from position i plus 1 onward)):\n      2.3.1.1 Add (item i of s) plus p to the end of the list out.\n  2.4 Give back out.\n3 Display the result of perms for (the next line typed by the user).\n4 End", "Count Subsets with Sum": "1 Start\n2 Define a reusable function named count that takes a, i, t:\n  2.1 If t equals 0:\n    2.1.1 Give back 1.\n  2.2 If i equals (the number of items in a) or t is less than 0:\n    2.2.1 Give back 0.\n  2.3 Give back (the result of count for a, (i plus 1), (t minus (item i of a))) plus (the result of count for a, (i plus 1), t).\n3 Read one line of whole numbers separated by spaces into the list a.\n4 Display the result of count for a, 0, (the whole number typed by the user).\n5 End", "Count Primes with a Helper": "1 Start\n2 Define a reusable function named is_prime that takes n:\n  2.1 If n is less than 2:\n    2.1.1 Give back false.\n  2.2 For each i taking the whole numbers from 2 up to (n raised to the power 0.5) as a whole number (included):\n    2.2.1 If (the remainder when n is divided by i) equals 0:\n      2.2.1.1 Give back false.\n  2.3 Give back true.\n3 Read a whole number typed by the user into n.\n4 Display the total of (the values of 1 for each x in the whole numbers from 2 up to n (included), only when the result of is_prime for x).\n5 End", "Higher-Order Function Toolkit": "1 Start\n2 Define a reusable function named twice that takes f:\n  2.1 Give back a rule that takes x giving the result of f for (the result of f for x).\n3 Define a reusable function named compose that takes any number of extra values called fs:\n  3.1 Define a reusable function named run that takes x:\n    3.1.1 For each f in fs in reverse order:\n      3.1.1.1 Set x to the result of f for x.\n    3.1.2 Give back x.\n  3.2 Give back run.\n4 Set inc to a rule that takes x giving x plus 1.\n5 Set dbl to a rule that takes x giving x times 2.\n6 Read a whole number typed by the user into x.\n7 Display the result of applying (the result of twice for inc) to x, the result of applying (the result of compose for dbl, inc) to x, the result of applying (the result of twice for (the result of twice for dbl)) to x, with a space between the values.\n8 End", "Countdown with Recursion": "1 Start\n2 Define a reusable function named countdown that takes n:\n  2.1 If n equals 0:\n    2.1.1 Display the text 'Go!'.\n    2.1.2 Finish the function.\n  2.2 Display n.\n  2.3 Carry out: the result of countdown for (n minus 1).\n3 Carry out: the result of countdown for (the whole number typed by the user).\n4 End", "Factorial with Call Trace": "1 Start\n2 Define a reusable function named fact that takes n:\n  2.1 If n is at most 1:\n    2.1.1 Give back 1.\n  2.2 Set r to n times (the result of fact for (n minus 1)).\n  2.3 Display (n written as text) followed by the text '! =', r, with a space between the values.\n  2.4 Give back r.\n3 Display the result of fact for (the whole number typed by the user).\n4 End", "Sum of 1 to n (Recursive)": "1 Start\n2 Define a reusable function named total that takes n:\n  2.1 If n equals 0:\n    2.1.1 Give back 0.\n  2.2 Give back n plus (the result of total for (n minus 1)).\n3 Display the result of total for (the whole number typed by the user).\n4 End", "Reverse a String Recursively": "1 Start\n2 Define a reusable function named rev that takes s:\n  2.1 If s equals an empty text:\n    2.1.1 Give back an empty text.\n  2.2 Give back (the result of rev for the items of s from position 1 onward) plus (the first item of s).\n3 Display the result of rev for (the next line typed by the user).\n4 End", "Fibonacci Series": "1 Start\n2 Define a reusable function named fib that takes n:\n  2.1 If n is less than 2:\n    2.1.1 Give back n.\n  2.2 Give back (the result of fib for (n minus 1)) plus (the result of fib for (n minus 2)).\n3 Read a whole number typed by the user into n.\n4 Display the list of (the result of fib for i) for each i in the whole numbers from 0 up to n - 1.\n5 End", "GCD by Euclid (Recursive)": "1 Start\n2 Define a reusable function named gcd that takes a, b:\n  2.1 If b equals 0:\n    2.1.1 Give back a.\n  2.2 Give back the result of gcd for b, (the remainder when a is divided by b).\n3 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n4 Display the result of gcd for a, b.\n5 End", "Recursive Palindrome Check": "1 Start\n2 Define a reusable function named pal that takes s:\n  2.1 If (the number of items in s) is less than 2:\n    2.1.1 Give back true.\n  2.2 If the first item of s is not equal to the last item of s:\n    2.2.1 Give back false.\n  2.3 Give back the result of pal for the items of s from position 1 up to position negative 1 (excluded).\n3 If the result of pal for (the next line typed by the user):\n  3.1 Display the text 'Palindrome'.\n4 Otherwise:\n  4.1 Display the text 'Not palindrome'.\n5 End", "Merge Sort": "1 Start\n2 Define a reusable function named msort that takes a:\n  2.1 If (the number of items in a) is at most 1:\n    2.1.1 Give back a.\n  2.2 Set mid to the whole-number part of (the number of items in a) divided by 2.\n  2.3 Set l to the result of msort for the first mid items of a.\n  2.4 Set r to the result of msort for the items of a from position mid onward.\n  2.5 Set out to an empty list.\n  2.6 Set every one of i, j to 0.\n  2.7 While i is less than (the number of items in l) as well as j is less than (the number of items in r), repeat the following:\n    2.7.1 If item i of l is at most item j of r:\n      2.7.1.1 Add item i of l to the end of the list out.\n      2.7.1.2 Increase i by 1.\n    2.7.2 Otherwise:\n      2.7.2.1 Add item j of r to the end of the list out.\n      2.7.2.2 Increase j by 1.\n  2.8 Give back (out plus (the items of l from position i onward)) plus (the items of r from position j onward).\n3 Display the result of msort for ((every item of ((the next line typed by the user) broken into words) converted to a whole number) as a list).\n4 End", "All Subsets (Power Set)": "1 Start\n2 Define a reusable function named subsets that takes a:\n  2.1 If not (a):\n    2.1.1 Give back a list holding an empty list.\n  2.2 Set rest to the result of subsets for the items of a from position 1 onward.\n  2.3 Give back rest plus (the list of (a list holding the first item of a plus s) for each s in rest).\n3 For each s in the result of subsets for ((the next line typed by the user) broken into words):\n  3.1 Display s.\n4 End", "N-Queens Solution Count": "1 Start\n2 Define a reusable function named solve that takes row, n, cols, d1, d2:\n  2.1 If row equals n:\n    2.1.1 Give back 1.\n  2.2 Set total to 0.\n  2.3 For each c taking the whole numbers from 0 up to n - 1:\n    2.3.1 If c is found in cols or (row minus c) is found in d1 or (row plus c) is found in d2:\n      2.3.1.1 Skip to the next repetition.\n    2.3.2 Increase total by the result of solve for (row plus 1), n, (every item found in cols or in a set holding c), (every item found in d1 or in a set holding (row minus c)), (every item found in d2 or in a set holding (row plus c)).\n  2.4 Give back total.\n3 Display the result of solve for 0, (the whole number typed by the user), (an empty set), (an empty set), (an empty set).\n4 End", "Binary Representation (Recursive)": "1 Start\n2 Define a reusable function named b that takes n:\n  2.1 If n is less than 2:\n    2.1.1 Give back n written as text.\n  2.2 Give back (the result of b for (the whole-number part of n divided by 2)) followed by ((the remainder when n is divided by 2) written as text).\n3 Display the result of b for (the whole number typed by the user).\n4 End", "Generate Parentheses": "1 Start\n2 Define a reusable function named gen that takes s, o, c, n:\n  2.1 If (the number of items in s) equals (2 times n):\n    2.1.1 Display s.\n    2.1.2 Finish the function.\n  2.2 If o is less than n:\n    2.2.1 Carry out: the result of gen for (s followed by the text '('), (o plus 1), c, n.\n  2.3 If c is less than o:\n    2.3.1 Carry out: the result of gen for (s followed by the text ')'), o, (c plus 1), n.\n3 Carry out: the result of gen for an empty text, 0, 0, (the whole number typed by the user).\n4 End", "Square and Cube with Lambda": "1 Start\n2 Set sq to a rule that takes x giving x times x.\n3 Set cube to a rule that takes x giving x raised to the power 3.\n4 Read a whole number typed by the user into n.\n5 Display the result of sq for n, the result of cube for n, with a space between the values.\n6 End", "Add Two Numbers with Lambda": "1 Start\n2 Set add to a rule that takes a, b giving a plus b.\n3 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n4 Display the result of add for a, b.\n5 End", "Even or Odd with Lambda": "1 Start\n2 Set f to a rule that takes n giving the text 'Even' if (the remainder when n is divided by 2) equals 0, otherwise the text 'Odd'.\n3 Display the result of f for (the whole number typed by the user).\n4 End", "Larger of Two with Lambda": "1 Start\n2 Set big to a rule that takes a, b giving a if a is greater than b, otherwise b.\n3 Read one line of whole numbers separated by spaces, then store them in a, b in order.\n4 Display the result of big for a, b.\n5 End", "Celsius List to Fahrenheit": "1 Start\n2 Read one line of numbers separated by spaces into the list c.\n3 Display (the result of applying a rule that takes x giving ((x times 9) divided by 5) plus 32 to every item of c) as a list.\n4 End", "Sort Students by Marks (lambda)": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines, each broken into words into the list s.\n4 Sort the list s in descending order by a rule that takes p giving item 1 of p as a whole number.\n5 For each p in s:\n  5.1 Display the first item of p, item 1 of p, with a space between the values.\n6 End", "Calculator with Dispatch Table": "1 Start\n2 Set ops to a dictionary pairing the text '+' with a rule that takes a, b giving a plus b, the text '-' with a rule that takes a, b giving a minus b, the text '*' with a rule that takes a, b giving a times b, the text '/' with a rule that takes a, b giving a divided by b if b is not equal to 0, otherwise the text 'Division by zero'.\n3 Read one line of text, then break it into words stored in a, op, b.\n4 If op is found in ops:\n  4.1 Display the result of applying item op of ops to (a as a decimal number), (b as a decimal number).\n5 Otherwise:\n  5.1 Display the text 'Unknown operator'.\n6 End", "Function Composition Pipeline": "1 Start\n2 Set steps to a dictionary pairing the text 'double' with a rule that takes x giving x times 2, the text 'inc' with a rule that takes x giving x plus 1, the text 'square' with a rule that takes x giving x times x.\n3 Read a whole number typed by the user into x.\n4 For each name in (the next line typed by the user) broken into words:\n  4.1 Set x to the result of applying item name of steps to x.\n  4.2 Display name, the text '->', x, with a space between the values.\n5 End", "Multi-key Record Sort": "1 Start\n2 Read a whole number typed by the user into n.\n3 Read n lines, each broken into words into the list r.\n4 Sort the list r in ascending order by a rule that takes p giving a group holding item 1 of p, (negative item 2 of p as a whole number), the first item of p.\n5 For each p in r:\n  5.1 Display the first item of p, item 1 of p, item 2 of p, with a space between the values.\n6 End", "Word Report with map, filter, sorted": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Set long_w to (the items of w that satisfy a rule that takes x giving (the number of items in x) is greater than 3) as a list.\n4 Display (the result of applying a rule that takes x giving x in upper case to every item of long_w) in ascending order by a rule that takes x giving a group holding (negative the number of items in x), x.\n5 Display the number of items in long_w, the text 'of', the number of items in w, with a space between the values.\n6 End", "Filter Long Words": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Set long_w to (the items of w that satisfy a rule that takes x giving (the number of items in x) is greater than 4) as a list.\n4 Display long_w, the number of items in long_w, with a space between the values.\n5 End", "Sort by Vowel Count": "1 Start\n2 Read one line of text, then break it into words stored in w.\n3 Set vowels to a rule that takes s giving the total of (the values of 1 for each c in s, only when c is found in the text 'aeiou').\n4 Sort the list w in ascending order by a rule that takes s giving a group holding (negative the result of vowels for s), (the number of items in s), s.\n5 Display w.\n6 End", "Right Triangle of Stars": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display the text '*' repeated i times.\n4 End", "Square of Stars": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 0 up to n - 1:\n  3.1 Display the items of (the text '*' repeated n times) joined with a space placed between them.\n4 End", "Number Triangle": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display the items of (the values of (j written as text) for each j in the whole numbers from 1 up to i (included)) joined with an empty text placed between them.\n4 End", "Inverted Triangle of Stars": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from n towards 0 (excluded) in steps of negative 1:\n  3.1 Display the text '*' repeated i times.\n4 End", "Floyd's Triangle": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set k to 1.\n4 For each i taking the whole numbers from 1 up to n (included):\n  4.1 Set row to an empty list.\n  4.2 For each j taking the whole numbers from 0 up to i - 1:\n    4.2.1 Add k written as text to the end of the list row.\n    4.2.2 Increase k by 1.\n  4.3 Display the items of row joined with a space placed between them.\n5 End", "Alphabet Triangle": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display the items of (the values of (the character with code (65 plus j)) for each j in the whole numbers from 0 up to i - 1) joined with an empty text placed between them.\n4 End", "Hollow Square": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 0 up to n - 1:\n  3.1 If i equals 0 or i equals (n minus 1):\n    3.1.1 Display the text '*' repeated n times.\n  3.2 Otherwise:\n    3.2.1 Display (the text '*' followed by (a space repeated (n minus 2) times)) followed by the text '*'.\n4 End", "Right-Aligned Triangle": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display (the text '*' repeated i times) padded on the left to a width of n.\n4 End", "Diamond of Stars": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display (a space repeated (n minus i) times) followed by (the text '*' repeated ((2 times i) minus 1) times).\n4 For each i taking the whole numbers from n minus 1 towards 0 (excluded) in steps of negative 1:\n  4.1 Display (a space repeated (n minus i) times) followed by (the text '*' repeated ((2 times i) minus 1) times).\n5 End", "Hollow Pyramid": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 If i equals 1:\n    3.1.1 Display (a space repeated (n minus 1) times) followed by the text '*'.\n  3.2 Otherwise, if i equals n:\n    3.2.1 Display the text '*' repeated ((2 times n) minus 1) times.\n  3.3 Otherwise:\n    3.3.1 Display (((a space repeated (n minus i) times) followed by the text '*') followed by (a space repeated ((2 times i) minus 3) times)) followed by the text '*'.\n4 End", "Butterfly Pattern": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 Display ((the text '*' repeated i times) followed by (a space repeated (2 times (n minus i)) times)) followed by (the text '*' repeated i times).\n4 For each i taking the whole numbers from n minus 1 towards 0 (excluded) in steps of negative 1:\n  4.1 Display ((the text '*' repeated i times) followed by (a space repeated (2 times (n minus i)) times)) followed by (the text '*' repeated i times).\n5 End", "Spiral Number Matrix": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set g to the list of (a list holding 0 times n) for each _ in the whole numbers from 0 up to n - 1.\n4 Set at the same time: top to 0, bot to n minus 1, left to 0, right to n minus 1.\n5 Set k to 1.\n6 While top is at most bot as well as left is at most right, repeat the following:\n  6.1 For each c taking the whole numbers from left up to right (included):\n    6.1.1 Set item c of item top of g to k.\n    6.1.2 Increase k by 1.\n  6.2 Increase top by 1.\n  6.3 For each r taking the whole numbers from top up to bot (included):\n    6.3.1 Set item right of item r of g to k.\n    6.3.2 Increase k by 1.\n  6.4 Decrease right by 1.\n  6.5 If top is at most bot:\n    6.5.1 For each c taking the whole numbers from right towards left minus 1 (excluded) in steps of negative 1:\n      6.5.1.1 Set item c of item bot of g to k.\n      6.5.1.2 Increase k by 1.\n    6.5.2 Decrease bot by 1.\n  6.6 If left is at most right:\n    6.6.1 For each r taking the whole numbers from bot towards top minus 1 (excluded) in steps of negative 1:\n      6.6.1.1 Set item left of item r of g to k.\n      6.6.1.2 Increase k by 1.\n    6.6.2 Increase left by 1.\n7 For each row in g:\n  7.1 Display the items of (the values of ((x written as text) padded on the left to a width of 2) for each x in row) joined with a space placed between them.\n8 End", "Hollow Right Triangle": "1 Start\n2 Read a whole number typed by the user into n.\n3 For each i taking the whole numbers from 1 up to n (included):\n  3.1 If i equals 1:\n    3.1.1 Display the text '*'.\n  3.2 Otherwise, if i equals n:\n    3.2.1 Display the text '*' repeated n times.\n  3.3 Otherwise:\n    3.3.1 Display (the text '*' followed by (a space repeated (i minus 2) times)) followed by the text '*'.\n4 End", "Centred Pascal's Triangle": "1 Start\n2 Read a whole number typed by the user into n.\n3 Set row to a list holding 1.\n4 For each i taking the whole numbers from 0 up to n - 1:\n  4.1 Set s to the items of (every item of row converted to text) joined with a space placed between them.\n  4.2 Display s centred in a field (n times 4) characters wide.\n  4.3 Set row to (a list holding 1 plus (the list of ((item j of row) plus (item (j plus 1) of row)) for each j in the whole numbers from 0 up to one less than ((the number of items in row) minus 1))) plus a list holding 1.\n5 End"};

async function pbk(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:100000,hash:"SHA-256"},k,256);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
